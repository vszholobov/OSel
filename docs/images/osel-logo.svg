<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="OSel: технологичный осёл">
  <title>OSel</title>
  <!-- antenna -->
  <line x1="128" y1="58" x2="128" y2="24" stroke="#4A4A55" stroke-width="6" stroke-linecap="round"/>
  <circle cx="128" cy="20" r="10" fill="#00C853" stroke="#2E7D32" stroke-width="3"/>
  <!-- ears -->
  <g stroke="#4A4A55" stroke-width="5" stroke-linejoin="round">
    <path d="M86 92 C60 70 44 30 52 10 C76 18 100 52 108 80 Z" fill="#9A9AA8"/>
    <path d="M168 90 C186 70 198 52 206 40 C224 46 238 62 240 78 C222 76 200 82 180 98 Z" fill="#9A9AA8"/>
  </g>
  <path d="M84 80 C70 64 62 42 62 28 C76 38 90 58 96 74 Z" fill="#F2B8C6"/>
  <path d="M178 86 C192 72 202 60 208 52 C220 56 228 64 230 72 C214 72 198 78 186 90 Z" fill="#F2B8C6"/>
  <!-- circuit traces on the ears -->
  <g stroke="#00C853" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M60 22 L66 34 L74 34"/>
    <path d="M226 62 L214 66 L208 74"/>
  </g>
  <circle cx="74" cy="34" r="3" fill="#00C853"/>
  <circle cx="208" cy="74" r="3" fill="#00C853"/>
  <!-- head -->
  <path d="M128 64 C176 64 196 100 194 140 C192 170 180 186 168 194 L88 194 C76 186 64 170 62 140 C60 100 80 64 128 64 Z"
        fill="#9A9AA8" stroke="#4A4A55" stroke-width="5" stroke-linejoin="round"/>
  <!-- mane tuft -->
  <path d="M104 70 C110 52 122 50 128 60 C134 48 150 52 152 70 C142 64 136 70 128 68 C120 70 112 64 104 70 Z"
        fill="#4A4A55"/>
  <!-- muzzle -->
  <ellipse cx="128" cy="198" rx="64" ry="48" fill="#E3DDD3" stroke="#4A4A55" stroke-width="5"/>
  <ellipse cx="106" cy="180" rx="8" ry="11" fill="#4A4A55"/>
  <ellipse cx="150" cy="180" rx="8" ry="11" fill="#4A4A55"/>
  <!-- grin with buck teeth -->
  <path d="M88 204 C104 238 152 238 168 204 Z" fill="#7A2E3A" stroke="#4A4A55" stroke-width="5" stroke-linejoin="round"/>
  <path d="M112 226 C120 220 136 220 144 226 C138 232 118 232 112 226 Z" fill="#E57388"/>
  <rect x="115" y="204" width="12" height="15" rx="2" fill="#FFFFFF" stroke="#4A4A55" stroke-width="2.5"/>
  <rect x="129" y="204" width="12" height="15" rx="2" fill="#FFFFFF" stroke="#4A4A55" stroke-width="2.5"/>
  <!-- visor -->
  <rect x="64" y="104" width="128" height="44" rx="20" fill="#1B1F24" stroke="#4A4A55" stroke-width="5"/>
  <path d="M76 112 L96 112" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
  <text x="128" y="137" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace"
        font-size="26" font-weight="700" fill="#00E676">&gt;_</text>
</svg>
