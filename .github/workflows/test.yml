name: test

on:
  # PR branches are covered by pull_request, so push only for master
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # the toolchain is pinned, a weekly run checks the latest nightly
  schedule:
    - cron: "0 5 * * 1"

# a new push to a PR cancels its outdated run, runs on master always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host-tests:
    name: host unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustc -V

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            runner -> target
            tools/docs-check -> target

      - name: Kernel logic (osel-core)
        run: cargo test-core

      - name: Runner
        run: cargo test-runner

      - name: Docs match the code
        run: cargo docs-check

  test:
    name: cargo test (${{ matrix.boot }})
    needs: host-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        boot: [uefi, bios]
    env:
      OSEL_BOOT: ${{ matrix.boot }}
      # the test kernels run slower on CI without KVM; give them more room than the 60 s default
      OSEL_TIMEOUT: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86

      # the runner builds user-go/gohello with this Go; the end-to-end test skips without it
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustc -V

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            runner -> target

      # the firmware only changes with the ovmf-prebuilt version
      - uses: actions/cache@v4
        with:
          path: runner/.ovmf
          key: ovmf-${{ hashFiles('runner/Cargo.lock') }}

      # every test binary runs even if an earlier one fails
      - name: Run tests in QEMU
        run: cargo test --no-fail-fast

      - name: Boot the real kernel
        run: OSEL_EXPECT="OSel ready to go!" cargo run

  latest-nightly:
    name: latest nightly (${{ matrix.boot }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        boot: [uefi, bios]
    env:
      OSEL_BOOT: ${{ matrix.boot }}
      OSEL_TIMEOUT: 180
      # overrides the pinned toolchain from rust-toolchain.toml
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Install the latest nightly
        run: |
          rustup toolchain install nightly --component rust-src,llvm-tools-preview --target x86_64-unknown-none
          rustc -V

      - name: Host tests
        run: cargo test-core && cargo test-runner

      - name: Run tests in QEMU
        run: cargo test --no-fail-fast
