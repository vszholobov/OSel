[package]
name = "osel-core"
description = "Platform independent parts of the OSel kernel, unit tested on the host"
version = "0.1.0"
edition = "2024"

[dependencies]
# no `instructions`: everything here must build and run on any host
x86_64 = { version = "0.15.5", default-features = false }
bootloader_api = "0.11.17"
pc-keyboard = "0.9"
linked_list_allocator = "0.10"
spin = "0.5.2"

[dependencies.noto-sans-mono-bitmap]
version = "0.3.2"
default-features = false
features = ["regular", "size_16", "unicode-basic-latin", "unicode-specials"]
