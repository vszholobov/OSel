[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
runner = "runner/run.sh"
# Kernel threads must not clobber user XMM state through AES-NI intrinsics.
rustflags = ["--cfg", "aes_force_soft"]

[alias]
# host unit tests, no QEMU needed
test-core = "test -p osel-core --target host-tuple"
test-runner = "test --manifest-path runner/Cargo.toml --target host-tuple"
# documentation matches the code, see docs/ru/developer/guides/writing-docs.md
docs-check = "test --manifest-path tools/docs-check/Cargo.toml --target host-tuple"
