[package]
name = "osel"
description = "OSel operating system"
version = "0.1.0"
edition = "2024"

[dependencies]
bootloader_api = "0.11.17"
spin = "0.5.2"
x86_64 = "0.15.5"
uart_16550 = "0.6.0"

[dependencies.noto-sans-mono-bitmap]
version = "0.3.2"
default-features = false
features = ["regular", "size_16", "unicode-basic-latin", "unicode-specials"]

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[[bin]]
name = "OSel"
path = "src/main.rs"
test = false

[lib]
name = "osel"
path = "src/lib.rs"
doctest = false

[[test]]
name = "stack_overflow"
harness = false
